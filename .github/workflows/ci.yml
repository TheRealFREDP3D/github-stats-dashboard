name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting of changed files
        shell: bash
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}"...HEAD \\
            | grep -E '\\.(css|js|jsx|json|md|ts|tsx|yaml|yml)$' \\
            | grep -v '^pnpm-lock\\.yaml$' || true)"
          if [ -z "$files" ]; then
            echo "No supported source or configuration files changed."
          else
            printf '%s\\n' "$files" | xargs pnpm exec prettier --check
          fi

      - name: Type-check application
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Build production artifacts
        run: pnpm run build
