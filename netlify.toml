[build]
  publish = "dist/public"
  command = "pnpm build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "pnpm dev"
  port = 3000
  publish = "dist/public"
  functions = "netlify/functions"

[dev.environment]
  GITHUB_CLIENT_ID = "test_client_id"
  GITHUB_REDIRECT_URI = "http://localhost:3000"

[[redirects]]
  from = "/api/auth/github/login-url"
  to = "/.netlify/functions/github-login-url"
  status = 200



[[redirects]]
  from = "/api/auth/exchange-token"
  to = "/.netlify/functions/exchange-token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm build"

[context.deploy-preview]
  command = "pnpm build"
