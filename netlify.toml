[build]
  publish = "dist/public"
  command = "pnpm build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# OAuth API endpoints
[[redirects]]
  from = "/api/auth/github/login-url"
  to = "/.netlify/functions/github-login-url"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/exchange-token"
  to = "/.netlify/functions/exchange-token"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm build"

[context.deploy-preview]
  command = "pnpm build"
